# Photos for the Gallery page. The first eight also fill the homepage mosaic,
# so keep a mix of subjects at the top.
#
#   src       image under images/ (e.g. images/site/exterior.jpg). Any size;
#             the build makes an 800px thumbnail and a 1600px lightbox copy.
#             Leave it out to show a placeholder until a photo is added.
#   alt       what the photo shows, for screen readers
#   caption   optional caption shown on hover
#   credit    optional photographer, shown after the caption
#   category  site | museum | events | historical (the filter buttons)
#   icon, label, height   placeholder appearance while src is empty
#
# Photos marked CHECK were taken from the old site without captions; the
# wording is a best guess from the file name and needs confirming.

categories:
  - id: site
    name: The Site
  - id: museum
    name: Museum Interior
  - id: events
    name: Events
  - id: historical
    name: Historical

photos:
  # --- First eight: the homepage mosaic ---
  - src: images/site/aerial-red-feather-club.jpg
    category: site
    alt: Aerial view of the Red Feather Club's restored Nissen huts and gardens
    caption: The Red Feather Club from the air
    credit: Richard Flagg

  - src: images/museum/museum-interior.jpg
    category: museum
    alt: Display cases and framed photographs beneath an American flag inside the museum
    caption: Inside the Red Feather Club

  - src: images/history/b17-44-8260.jpg
    category: historical
    alt: A B-17 Flying Fortress in flight, with the Square B tail marking of the 95th
    caption: B-17 44-8260 of the 95th Bomb Group  # CHECK

  - src: images/events/dance-floor.jpg
